name: Deploy RealPixelArt website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-org-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'Bocchi-The-Glock/Real-PixelArt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Run regression tests
        run: python -m pytest src/tests/test_realpixelart.py -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify JavaScript algorithm against Python reference
        run: |
          python scripts/export_web_reference.py
          npm --prefix web test

      - name: Build static website
        run: node web/build.mjs --out build/pages

      - name: Check deployment credential
        env:
          ORG_PAGES_TOKEN: ${{ secrets.ORG_PAGES_TOKEN }}
        run: |
          if [ -z "$ORG_PAGES_TOKEN" ]; then
            echo "::error::Add the ORG_PAGES_TOKEN Actions secret in Bocchi-The-Glock/Real-PixelArt. See .github/DEPLOYMENT.md."
            exit 1
          fi

      - name: Publish to organization repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ORG_PAGES_TOKEN }}
          external_repository: RealPixelArt/RealPixelArt.github.io
          publish_branch: gh-pages
          publish_dir: ./build/pages
          enable_jekyll: false
          # Retrying after enabling Pages must push even if the site is unchanged.
          allow_empty_commit: true
          # This branch contains generated files only. Keep commit history.
          keep_files: false
          force_orphan: false
          commit_message: "Deploy Real-PixelArt"
