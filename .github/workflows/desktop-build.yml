name: Build lightweight desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', 'web/**', '.github/workflows/desktop-build.yml']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm run prepare:web
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test desktop adapter
        run: npm test
      - name: Test native validation
        run: npm run test:rust
      - name: Test actual WebView, output pixels and exports
        run: npm run test:native
      - name: Build release without test hooks
        run: npm run build:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: RealPixelArt-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightweight-checks-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/test-results/native/report.json
            desktop/test-results/native/progress.log
            desktop/test-results/native/native.log
          if-no-files-found: ignore
