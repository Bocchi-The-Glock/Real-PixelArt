name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python reference-test dependencies
        run: python -m pip install -r ../.github/requirements-ci.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Test actual desktop runtime
        run: npm test
      - name: Package desktop app
        run: npm run dist:${{ matrix.target }}
      - name: Test packaged app on the runner architecture
        run: npm run test:packaged
      - name: Test Windows single-file launcher
        if: matrix.target == 'win'
        run: npm run test:portable
      - name: Test persistent runtime cache and recovery
        if: matrix.target == 'win'
        run: npm run test:cache
      - uses: actions/upload-artifact@v4
        with:
          name: RealPixelArt-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-checks-${{ matrix.target }}
          path: desktop/test-results/*/verification.json
          if-no-files-found: ignore
