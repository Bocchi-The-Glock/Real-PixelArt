[package]
name = "realpixelart"
version = "0.1.0"
description = "RealPixelArt lightweight desktop application"
authors = ["Bocchi-The-Glock"]
license = "MIT"
edition = "2021"
default-run = "realpixelart"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
custom-protocol = ["tauri/custom-protocol"]

smoke-test = []
