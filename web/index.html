<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <meta name="description" content="RealPixelArt — local pixel art recovery.">
  <title>RealPixelArt</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://github.com/Bocchi-The-Glock/Real-PixelArt" target="_blank" rel="noopener noreferrer" data-i18n-aria="githubRepo" data-i18n-title="githubRepo" aria-label="访问 GitHub 仓库" title="访问 GitHub 仓库">Real Pixel <span>Art</span></a>
    <div class="top-actions">
      <a id="github-header-link" class="github-fab github-header-link" href="https://github.com/Bocchi-The-Glock/Real-PixelArt" target="_blank" rel="noopener noreferrer" data-i18n-aria="githubRepo" data-i18n-title="githubRepo" aria-label="访问 GitHub 仓库" title="访问 GitHub 仓库">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>GitHub</span>
      </a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="切换夜间模式" title="切换夜间模式">
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      </button>
      <button id="language-toggle" class="icon-button language-button" type="button" aria-label="Switch to English" title="Switch to English"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M9 2v3m4 0c-1 6-4 9-9 12m2-9c1 4 4 7 8 9m1 4 4-11 4 11m-6-4h4"/></svg><span id="language-label">EN</span></button>
    </div>
  </header>
  <main>
    <section class="preview-section" data-i18n-aria="previews">
      <div class="preview-toolbar">
        <label><span data-i18n="background">预览背景</span><select id="background" data-i18n-aria="background"><option value="checker" data-i18n="checker">透明棋盘</option><option value="white" data-i18n="white">纯白</option><option value="dark" data-i18n="darkBackground">深色</option></select></label>
      </div>
      <div class="preview-grid">
        <article class="preview-panel">
          <div class="panel-heading"><h1 data-i18n="original">原图</h1><span id="original-size">—</span></div>
          <div class="image-viewport">
          <div class="image-stage checker" id="original-stage" role="button" tabindex="0" data-i18n-aria="choose" aria-disabled="false" data-i18n-title="replace">
            <div class="placeholder" id="original-placeholder"><span class="upload-icon" aria-hidden="true">＋</span><strong data-i18n="choose">点击或拖入图片</strong></div>
            <img id="original-image" data-i18n-alt="original" draggable="false" hidden>
          </div>
          <div class="zoom-controls" id="original-zoom-controls" hidden>
            <button id="original-zoom-out" type="button" class="zoom-step" data-i18n-aria="zoomOut" data-i18n-title="zoomOut" disabled>−</button><output id="original-zoom-value">—</output><button id="original-zoom-in" type="button" class="zoom-step" data-i18n-aria="zoomIn" data-i18n-title="zoomIn" disabled>+</button><button id="original-fit" type="button" class="text-button" data-i18n="fit" disabled>适应窗口</button>
          </div>
          </div>
          <div class="panel-footer"><span id="original-label">未选择图片</span><div><button id="sample" type="button" class="text-button" data-i18n="sample">示例</button><button id="clear-file" type="button" class="text-button" data-i18n="remove" hidden>移除</button></div></div>
          <div class="status-strip" role="status" aria-live="polite"><span class="status-icon" id="status-icon" aria-hidden="true">○</span><span id="status">请选择图片。</span></div>
          <div class="panel-actions"><button class="upload-button" id="upload" type="button" data-i18n="upload">上传图片</button><button class="run-button" id="run" type="submit" form="settings" disabled>生成</button><button class="cancel-button" id="cancel" type="button" data-i18n="cancel" hidden>取消</button></div>
        </article>
        <article class="preview-panel result-panel">
          <div class="panel-heading"><h2 data-i18n="restored">恢复结果</h2><span id="result-size">—</span></div>
          <div class="image-viewport">
          <div class="image-stage checker" id="result-stage"><div class="placeholder" id="result-placeholder"><span data-i18n="waiting">等待生成</span></div><img id="result-image" data-i18n-alt="restored" draggable="false" hidden></div>
          <div class="zoom-controls" id="result-zoom-controls" hidden>
            <button id="result-zoom-out" type="button" class="zoom-step" data-i18n-aria="zoomOut" data-i18n-title="zoomOut" disabled>−</button><output id="result-zoom-value">—</output><button id="result-zoom-in" type="button" class="zoom-step" data-i18n-aria="zoomIn" data-i18n-title="zoomIn" disabled>+</button><button id="result-fit" type="button" class="text-button" data-i18n="fit" disabled>适应窗口</button>
          </div>
          </div>
          <div class="export-settings">
            <label for="scale"><span data-i18n="exportScale">导出倍数</span><output id="scale-value" for="scale">1×</output></label>
            <div class="range-row"><span>1×</span><input id="scale" type="range" min="1" max="16" step="1" value="1"><span>16×</span></div>
          </div>
          <div class="panel-actions"><button id="download" type="button" class="download-button" aria-disabled="true" disabled data-i18n="download">下载 PNG</button><a id="download-debug" class="secondary-download" data-i18n="debugZip" hidden>诊断 ZIP</a></div>
        </article>
      </div>
      <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff,image/gif" hidden>
      <div class="result-summary" id="result-summary" hidden>
        <div><span data-i18n="nativeGrid">原生网格</span><strong id="metric-grid">—</strong></div>
        <div><span data-i18n="spacing">源图格距</span><strong id="metric-spacing">—</strong></div>
        <div><span data-i18n="confidence" data-i18n-title="confidenceHelp">启发式置信分数</span><strong id="metric-confidence">—</strong></div>
        <div><span data-i18n="time">处理耗时</span><strong id="metric-time">—</strong></div>
      </div>
    </section>
    <section class="controls" data-i18n-aria="parameters">
      <form id="settings">
        <fieldset id="settings-fields">
          <div class="section-title"><h2 data-i18n="parameters">参数</h2><button class="text-button" id="reset" type="button" data-i18n="reset">重置</button></div>
          <div class="basic-settings">
            <label><span data-i18n="sampling">取色方式</span><select id="sampling"><option value="robust" data-i18n="robust">稳健取色 · 中心优先</option><option value="center" data-i18n="center">中心采样</option><option value="median" data-i18n="median">中值采样</option></select></label>
            <label><span data-i18n="alpha">透明度</span><select id="alpha-mode"><option value="auto" data-i18n="alphaAuto">保留采样透明度</option><option value="coverage" data-i18n="coverage">按区域覆盖率平均</option><option value="binary" data-i18n="binary">二值透明度</option></select></label>
            <label><span data-i18n="warp">局部网格调整</span><select id="local-warp"><option value="auto" data-i18n="auto">自动</option><option value="off" data-i18n="off">关闭</option></select></label>
          </div>
          <details class="advanced"><summary data-i18n="more">更多设置</summary><div class="advanced-settings">
            <label><span data-i18n="minSpacing">最小间距</span><input id="min-size" type="number" min="1" step="any" value="2"></label>
            <label><span data-i18n="maxSpacing">最大间距</span><input id="max-size" type="number" min="1" step="any" value="64"></label>
          </div>
          <div class="check-settings"><label class="check"><input id="square" type="checkbox"><span data-i18n="square">强制正方形网格</span></label><label class="check"><input id="debug" type="checkbox" checked><span data-i18n="debug">生成处理过程</span></label></div>
          <label class="check"><input id="photo-mode" type="checkbox" checked><span data-i18n="photoMode">未识别网格时自动像素化</span></label></details>
        </fieldset>
      </form>
      <form id="color-settings" class="color-settings">
        <fieldset id="color-fields">
          <div class="section-title"><h2 data-i18n="colorPost">颜色处理（可选）</h2><span id="color-summary" class="field-hint"></span></div>
          <label class="check alpha-option" data-i18n-title="noSemitransparentHelp"><input id="no-semitransparent" type="checkbox"><span data-i18n="noSemitransparent">无半透明像素</span></label>
          <div class="basic-settings">
            <div class="color-limit">
              <div class="color-limit-heading"><label for="colors" data-i18n="colors">限定颜色数量</label><span class="color-value"><span class="value-size" data-i18n="keepColors" aria-hidden="true">不限制</span><output id="colors-value" for="colors">不限制</output><span id="color-editor" hidden><button id="colors-decrease" class="color-step" type="button" data-i18n-aria="fewerColors" data-i18n-title="fewerColors">−</button><input id="colors-number" type="number" min="2" max="512" step="1" value="2" data-i18n-aria="colors" disabled><button id="colors-increase" class="color-step" type="button" data-i18n-aria="moreColors" data-i18n-title="moreColors">+</button></span></span></div>
              <div class="color-track">
                <input id="colors" type="range" min="0" max="1000" step="1" value="0" aria-valuetext="不限制">
                <div class="color-stops" aria-hidden="true"><span class="unlimited-stop"><i></i><span data-i18n="keepColorsStop">不限制</span></span><span class="minimum-stop"><i></i>2</span><span class="maximum-stop"><i></i><span id="colors-max">512</span></span></div>
              </div>
            </div>
            <label class="check"><input id="use-palette" type="checkbox"><span data-i18n="usePalette">使用色库</span></label>
            <label><span data-i18n="palette">色库</span><select id="palette" disabled></select></label>
            <label><span data-i18n="colorMode">颜色模式</span><select id="color-mode"><option value="natural" data-i18n="natural">自然</option><option value="rgb">RGB</option></select></label>
          </div>
          <p id="palette-note" class="field-hint" hidden></p>
          <p class="field-hint" data-i18n="colorHelp">在恢复结果上调整，无需重新识别网格。</p>
        </fieldset>
      </form>
    </section>
    <details class="diagnostics" id="diagnostics" hidden><summary data-i18n="diagnostics">处理过程</summary><div id="diagnostic-tabs" class="diagnostic-tabs"></div><div class="diagnostic-preview"><img id="diagnostic-image" alt=""></div></details>
  </main>
  <a id="github-link" class="github-fab" href="https://github.com/Bocchi-The-Glock/Real-PixelArt" target="_blank" rel="noopener noreferrer" data-i18n-aria="githubRepo" data-i18n-title="githubRepo" aria-label="访问 GitHub 仓库" title="访问 GitHub 仓库">
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    <span>GitHub</span>
  </a>
  <noscript>Please enable JavaScript / 请启用 JavaScript。</noscript>
</body>
</html>
